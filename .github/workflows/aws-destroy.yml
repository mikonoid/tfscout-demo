name: aws destroy

# Removes everything created by envs/aws. Type "destroy" to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to remove all demo resources from AWS
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == 'destroy' && vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform destroy -input=false -auto-approve
