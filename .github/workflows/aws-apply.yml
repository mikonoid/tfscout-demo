name: aws apply

# Merges to main are applied to the AWS account. Only main can assume the apply role.
on:
  push:
    branches: [main]
    paths: ["modules/**", "envs/aws/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws
  cancel-in-progress: false

jobs:
  apply:
    if: vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -input=false -auto-approve
